<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>預約諮詢 · 預見居所</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: #fcfbfa;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      background: linear-gradient(135deg, #222 0%, #3a2e24 100%);
      padding: 28px 24px 24px;
      color: #fcfbfa;
      position: relative;
    }
    .header-brand {
      font-family: 'Noto Serif TC', serif;
      font-size: 13px;
      letter-spacing: 4px;
      color: #c5a880;
      margin-bottom: 8px;
    }
    .header h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    .header p {
      font-size: 13px;
      opacity: 0.6;
      font-weight: 300;
    }

    .content {
      flex: 1;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .reserve-card {
      background: #fff;
      padding: 36px 24px 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid #eee;
      transition: box-shadow 0.3s;
    }
    .reserve-card:hover {
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
    }

    .reserve-icon {
      width: 72px;
      height: 72px;
      background: #f8f7f5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .reserve-icon svg {
      width: 34px;
      height: 34px;
      stroke: #c5a880;
      fill: none;
      stroke-width: 1.5;
    }

    .reserve-card h2 {
      font-family: 'Noto Serif TC', serif;
      font-size: 20px;
      font-weight: 600;
      color: #222;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .reserve-card p {
      font-size: 13px;
      color: #888;
      font-weight: 300;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .reserve-info {
      text-align: left;
      background: #f8f7f5;
      padding: 16px 18px;
      margin-bottom: 24px;
      border-radius: 2px;
    }
    .reserve-info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #555;
      padding: 6px 0;
    }
    .reserve-info-item svg {
      width: 16px;
      height: 16px;
      stroke: #c5a880;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .btn-reserve {
      display: inline-block;
      width: 100%;
      padding: 14px 24px;
      background: #c5a880;
      color: #fcfbfa;
      border: none;
      border-radius: 2px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s;
    }
    .btn-reserve:active {
      background: #b0926a;
    }

    .bottom-tab {
      background: #fff;
      padding: 8px 0;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: center;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 0;
      width: 100px;
      color: #c5a880;
      text-decoration: none;
    }
    .tab-item svg {
      width: 22px;
      height: 22px;
      stroke: #c5a880;
      fill: none;
      stroke-width: 1.5;
    }
    .tab-item span {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .before-launch {
      display: none;
      background: #f8f7f5;
      color: #888;
      padding: 12px 20px;
      margin-bottom: 16px;
      font-size: 12px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      border: 1px solid #eee;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-brand">預見居所 · 遇見居所</div>
    <h1>預約專屬諮詢</h1>
    <p>填寫預約資訊，我們將盡快與您聯繫</p>
  </div>

  <div class="content">
    <div class="before-launch" id="notice">
      此頁面需在 LINE 內開啟才能使用完整功能
    </div>
    <div class="reserve-card">
      <div class="reserve-icon">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <line x1="12" y1="14" x2="12" y2="18"/>
          <line x1="10" y1="16" x2="14" y2="16"/>
        </svg>
      </div>
      <h2>開始預約</h2>
      <p>為您安排專業諮詢時段<br>提供最合適的空間規劃建議</p>

      <div class="reserve-info">
        <div class="reserve-info-item">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>約 3 分鐘即可完成</span>
        </div>
        <div class="reserve-info-item">
          <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span>專人電話或 LINE 確認時段</span>
        </div>
        <div class="reserve-info-item">
          <svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>免費諮詢，無需任何費用</span>
        </div>
      </div>

      <a class="btn-reserve" id="formLink" href="#" target="_blank" rel="noopener">
        填寫預約資料
      </a>
    </div>
  </div>

  <div class="bottom-tab">
    <a class="tab-item" id="tabLink" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>預約諮詢</span>
    </a>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2.1/liff.js"></script>
  <script>
    const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfcqBBKlCHvZliwFg_gNdwSWlP5-wWnXJicbSWGCH_lTm8Xuw/viewform';

    document.getElementById('formLink').href = FORM_URL;
    document.getElementById('tabLink').href = FORM_URL;

    async function initLiff() {
      try {
        await liff.init({ liffId: '2010489308-Gcw8kvOK' });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          console.log('User:', profile.displayName);
        } else {
          liff.login();
        }
      } catch (err) {
        document.getElementById('notice').style.display = 'block';
        console.warn('LIFF init failed (expected outside LINE):', err);
      }
    }
    if (typeof liff !== 'undefined') {
      initLiff();
    }
  </script>
</body>
</html>
