<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>問卷填寫</title>
  <link rel="icon" href="data:,">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(135deg, #06c755, #00b84d);
      padding: 24px 20px 20px;
      color: white;
      position: relative;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 13px;
      opacity: 0.85;
    }
    .content {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .form-card {
      background: white;
      border-radius: 16px;
      padding: 40px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
    }
    .form-card .icon {
      width: 72px;
      height: 72px;
      background: #e8f5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .form-card .icon svg {
      width: 36px;
      height: 36px;
    }
    .form-card h2 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .form-card p {
      font-size: 13px;
      color: #888;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-form {
      display: inline-block;
      width: 100%;
      padding: 14px 24px;
      background: #06c755;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-form:active {
      background: #00a844;
    }
    .bottom-tab {
      background: white;
      padding: 8px 0;
      border-top: 1px solid #e8e8e8;
      display: flex;
      justify-content: center;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 0;
      width: 80px;
      color: #06c755;
      text-decoration: none;
    }
    .tab-item svg {
      width: 24px;
      height: 24px;
      fill: #06c755;
    }
    .tab-item span {
      font-size: 10px;
      font-weight: 500;
    }
    .before-launch {
      display: none;
      background: #fff3cd;
      color: #856404;
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>問卷填寫</h1>
    <p>感謝您的參與，請點擊下方按鈕填寫表單</p>
  </div>

  <div class="content">
    <div class="before-launch" id="notice">
      ⚠️ 此頁面需在 LINE 內開啟才能使用完整功能<br>
      <small>請透過 LIFF 網址開啟</small>
    </div>
    <div class="form-card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="#06c755">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
        </svg>
      </div>
      <h2>開始填寫問卷</h2>
      <p>預計花費 3-5 分鐘，您的回饋對我們非常重要</p>
      <a class="btn-form" id="formLink" href="#" target="_blank" rel="noopener">
        前往填寫 →
      </a>
    </div>
  </div>

  <div class="bottom-tab">
    <a class="tab-item" id="tabLink" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
      </svg>
      <span>填寫問卷</span>
    </a>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2.1/liff.js"></script>
  <script>
    const FORM_URL = 'https://docs.google.com/forms/d/e/1Vm3aDHkb02A54suGp_EpPoYQ4HkczXGSYbEq-tuzYCg/viewform';

    document.getElementById('formLink').href = FORM_URL;
    document.getElementById('tabLink').href = FORM_URL;

    async function initLiff() {
      try {
        await liff.init({ liffId: '2010489308-Gcw8kvOK' });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          console.log('User:', profile.displayName);
        } else {
          liff.login();
        }
      } catch (err) {
        document.getElementById('notice').style.display = 'block';
        console.warn('LIFF init failed (expected outside LINE):', err);
      }
    }
    if (typeof liff !== 'undefined') {
      initLiff();
    }
  </script>
</body>
</html>
