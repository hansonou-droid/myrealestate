<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>360° Panorama Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }
body { background:#100c07; color:#F7F3EC; font-family:system-ui,sans-serif; }
button { cursor:pointer; }

#upload-screen {
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:#F7F3EC; color:#3A2E24;
}
.upload-headline { font-size:28px; font-weight:300; margin-bottom:6px; }
.upload-sub      { font-size:14px; opacity:0.6; margin-bottom:36px; }

.upload-zone {
  width:400px; height:220px;
  border:1px solid #C4B9A8;
  display:flex; align-items:center; justify-content:center;
  position:relative; transition:border-color .25s, background .25s;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color:#C9A97A; background:rgba(201,169,122,.07);
}
.upload-inner {
  display:flex; flex-direction:column; align-items:center; gap:10px;
  pointer-events:none;
}
.upload-label { font-size:13px; }
.upload-hint  { font-size:11px; opacity:0.5; }
#file-input { position:absolute; inset:0; opacity:0; cursor:pointer; }

#viewer-screen {
  width:100%; height:100%;
  position:relative; display:none; cursor:grab;
}
#viewer-screen:active { cursor:grabbing; }
#three-canvas { position:absolute; inset:0; display:block; }

.vignette {
  position:absolute; inset:0;
  background:radial-gradient(ellipse at center, transparent 50%, rgba(10,7,3,.62) 100%);
  pointer-events:none; z-index:1;
}

#compass {
  position:absolute; top:50%; right:24px;
  transform:translateY(-50%);
  width:44px; height:44px; z-index:10;
  pointer-events:none; opacity:0.5;
}

.viewer-bottom {
  position:absolute; bottom:0; left:0; right:0;
  padding:18px 24px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(to top, rgba(10,7,3,.6) 0%, transparent 100%);
  z-index:10;
}
.hint-text { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; opacity:0.4; }
.ctrl-group { display:flex; gap:6px; }

.ctrl-btn {
  background:rgba(247,243,236,.1);
  border:1px solid rgba(247,243,236,.18);
  color:rgba(247,243,236,.75);
  font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
  padding:7px 14px; transition:all .25s;
}
.ctrl-btn:hover {
  background:rgba(201,169,122,.25);
  border-color:rgba(201,169,122,.4);
  color:#C9A97A;
}
.ctrl-btn.active {
  background:rgba(201,169,122,.25);
  border-color:#C9A97A; color:#C9A97A;
}

/* VR 按鈕 - 金色強調，永遠顯示 */
#vr-btn {
  background: rgba(201,169,122,.2);
  border: 1px solid rgba(201,169,122,.6);
  color: #C9A97A;
  font-weight: 500;
}
#vr-btn:hover {
  background: rgba(201,169,122,.35);
  border-color: #C9A97A;
  color: #e8c98a;
}
#vr-btn.vr-on {
  background: rgba(201,169,122,.45);
  border-color: #e8c98a;
  color: #fff8ed;
  box-shadow: 0 0 10px rgba(201,169,122,.4);
}

/* Toast 提示 */
#toast {
  position: absolute;
  bottom: 68px; right: 24px;
  max-width: 280px;
  background: rgba(16,12,7,.92);
  border: 1px solid rgba(247,243,236,.2);
  color: rgba(247,243,236,.85);
  font-size: 11px; line-height: 1.55;
  padding: 10px 16px;
  z-index: 30;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}
#toast.show { opacity: 1; }

#loading {
  position:fixed; inset:0; background:#F7F3EC;
  display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:16px; z-index:999;
}
#loading.visible { display:flex; }
.load-ring {
  width:36px; height:36px;
  border:1.5px solid #C4B9A8;
  border-top-color:#C9A97A; border-radius:50%;
  animation:spin .85s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.load-text { font-size:10px; letter-spacing:3px; text-transform:uppercase; opacity:0.5; color:#3A2E24; }
</style>
</head>
<body>

<!-- ── 上傳畫面 ── -->
<div id="upload-screen">
  <h1 class="upload-headline">360° Panorama Viewer</h1>
  <p class="upload-sub">Drop or select an equirectangular image</p>
  <div class="upload-zone" id="upload-zone">
    <div class="upload-inner">
      <span class="upload-label">載入全景圖</span>
      <span class="upload-hint">JPG / PNG · 建議比例 2:1</span>
    </div>
    <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp">
  </div>
</div>

<!-- ── 檢視畫面 ── -->
<div id="viewer-screen">
  <canvas id="three-canvas"></canvas>
  <div class="vignette"></div>

  <div id="compass">
    <svg viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" stroke="#F7F3EC" stroke-width="0.7" opacity="0.35"/>
      <text x="24" y="5"  text-anchor="middle" font-size="6.5" fill="#C9A97A" font-weight="500">N</text>
      <text x="24" y="46" text-anchor="middle" font-size="5.5" fill="#F7F3EC" opacity="0.45">S</text>
      <text x="45" y="26" text-anchor="middle" font-size="5.5" fill="#F7F3EC" opacity="0.45">E</text>
      <text x="3"  y="26" text-anchor="middle" font-size="5.5" fill="#F7F3EC" opacity="0.45">W</text>
      <line x1="24" y1="8"  x2="24" y2="16" stroke="#F7F3EC" stroke-width="0.6" opacity="0.35"/>
      <line x1="24" y1="32" x2="24" y2="40" stroke="#F7F3EC" stroke-width="0.6" opacity="0.35"/>
      <line x1="8"  y1="24" x2="16" y2="24" stroke="#F7F3EC" stroke-width="0.6" opacity="0.35"/>
      <line x1="32" y1="24" x2="40" y2="24" stroke="#F7F3EC" stroke-width="0.6" opacity="0.35"/>
      <g id="compass-needle">
        <polygon points="24,10 26.5,24 24,20 21.5,24" fill="#C9A97A" opacity="0.95"/>
        <polygon points="24,38 26.5,24 24,28 21.5,24" fill="#F7F3EC" opacity="0.4"/>
      </g>
      <circle cx="24" cy="24" r="2" fill="#C9A97A"/>
    </svg>
  </div>

  <div id="toast"></div>

  <div class="viewer-bottom">
    <span class="hint-text">拖曳旋轉 · 滾輪縮放 · 空白鍵自動旋轉 · R 重設</span>
    <div class="ctrl-group">
      <button class="ctrl-btn" id="rotate-btn">自動旋轉</button>
      <button class="ctrl-btn" id="fs-btn">全螢幕</button>
      <button class="ctrl-btn" id="vr-btn">⬛ 進入 VR</button>
      <button class="ctrl-btn" id="back-btn">← 返回</button>
    </div>
  </div>
</div>

<div id="loading">
  <div class="load-ring"></div>
  <div class="load-text">載入全景圖中</div>
</div>

<script>
/* ─────────────────────────────────────────
   狀態
───────────────────────────────────────── */
let scene, camera, renderer, sphere;
let lon = 0, lat = 0, fov = 75;
let isDragging = false, prevMouse = {x:0,y:0};
let prevPinch = null;
let autoRotate = false;
let xrSession  = null;
let toastTimer = null;

/* ─────────────────────────────────────────
   Toast
───────────────────────────────────────── */
function showToast(msg, ms = 4000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

/* ─────────────────────────────────────────
   Three.js 初始化
   ★ 關鍵：以 xrCompatible:true 建立 GL context
     讓 WebXR requestSession 之前 context 已就緒
───────────────────────────────────────── */
function initViewer(url) {
  const canvas = document.getElementById('three-canvas');

  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(fov, innerWidth / innerHeight, 0.1, 2000);
  camera.position.set(0, 0, 0);

  /* ★ 明確以 xrCompatible:true 建立 WebGL context */
  const ctxOpts = { antialias: true, xrCompatible: true };
  const gl = canvas.getContext('webgl2', ctxOpts)
          || canvas.getContext('webgl',  ctxOpts);

  renderer = new THREE.WebGLRenderer({ canvas, context: gl });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.xr.enabled = true;  /* ★ 啟用 XR */

  /* 等距長方形球體（內翻） */
  const geo = new THREE.SphereGeometry(500, 72, 40);
  geo.scale(-1, 1, 1);

  const tex = new THREE.TextureLoader().load(url, () => {
    document.getElementById('loading').classList.remove('visible');
  });
  tex.minFilter = THREE.LinearFilter;

  sphere = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex }));
  scene.add(sphere);

  bindEvents(canvas);
  renderer.setAnimationLoop(renderLoop); /* ★ 取代 requestAnimationFrame */
}

/* ─────────────────────────────────────────
   渲染迴圈
───────────────────────────────────────── */
function renderLoop() {
  /* VR 模式：Quest 頭追蹤接管，不做手動 lookAt */
  if (!renderer.xr.isPresenting) {
    if (autoRotate && !isDragging) lon += 0.055;
    lat = Math.max(-85, Math.min(85, lat));

    const phi   = THREE.MathUtils.degToRad(90 - lat);
    const theta = THREE.MathUtils.degToRad(lon);
    camera.lookAt(
      500 * Math.sin(phi) * Math.cos(theta),
      500 * Math.cos(phi),
      500 * Math.sin(phi) * Math.sin(theta)
    );

    const needle = document.getElementById('compass-needle');
    if (needle) needle.setAttribute('transform', `rotate(${-lon % 360}, 24, 24)`);
  }

  renderer.render(scene, camera);
}

/* ─────────────────────────────────────────
   VR 進入 / 退出（Meta Quest 2 WebXR）
───────────────────────────────────────── */
const vrBtn = document.getElementById('vr-btn');

async function toggleVR() {

  /* 退出 VR */
  if (xrSession) {
    xrSession.end();
    return;
  }

  /* 檢查 WebXR API 存在 */
  if (!navigator.xr) {
    showToast('瀏覽器不支援 WebXR API');
    return;
  }

  /* 檢查 immersive-vr 支援 */
  let supported = false;
  try { supported = await navigator.xr.isSessionSupported('immersive-vr'); }
  catch(e) { /* 部分瀏覽器會 throw */ }

  if (!supported) {
    showToast('此裝置不支援 immersive-vr\n請確認 Meta Quest 已正確設定');
    return;
  }

  /* ★ 關鍵修正：requestSession 前先 makeXRCompatible
       避免 "the specified session is not supported" */
  try {
    const gl = renderer.getContext();
    if (typeof gl.makeXRCompatible === 'function') {
      await gl.makeXRCompatible();
    }
  } catch(e) { /* 若 context 已相容則忽略 */ }

  /* 請求 VR session */
  try {
    xrSession = await navigator.xr.requestSession('immersive-vr', {
      optionalFeatures: ['local-floor', 'bounded-floor', 'local']
    });
  } catch(e) {
    xrSession = null;
    const isFile = location.protocol === 'file:';
    if (isFile) {
      showToast('VR 啟動失敗\n⚠ 請透過 HTTP/HTTPS 伺服器開啟此檔案\n（不可直接用 file:// 開啟）', 7000);
    } else {
      showToast('VR 啟動失敗：' + e.message, 5000);
    }
    return;
  }

  /* 綁定 session 到 renderer（不 await，符合 Three.js VRButton 行為） */
  renderer.xr.setSession(xrSession);

  vrBtn.textContent = '⬛ 退出 VR';
  vrBtn.classList.add('vr-on');
  if (autoRotate) toggleRotate();

  /* Quest 按 Menu 鍵退出時同步更新按鈕 */
  xrSession.addEventListener('end', () => {
    xrSession = null;
    vrBtn.textContent = '⬛ 進入 VR';
    vrBtn.classList.remove('vr-on');
  });
}

/* ─────────────────────────────────────────
   事件綁定
───────────────────────────────────────── */
function bindEvents(canvas) {
  canvas.addEventListener('mousedown', e => {
    isDragging = true;
    prevMouse = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    lon -= (e.clientX - prevMouse.x) * 0.18;
    lat += (e.clientY - prevMouse.y) * 0.18;
    prevMouse = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('mouseup', () => isDragging = false);

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    fov = Math.max(30, Math.min(100, fov + e.deltaY * 0.04));
    camera.fov = fov; camera.updateProjectionMatrix();
  }, { passive: false });

  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      isDragging = true;
      prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    if (e.touches.length === 2) prevPinch = pinchDist(e);
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      lon -= (e.touches[0].clientX - prevMouse.x) * 0.25;
      lat += (e.touches[0].clientY - prevMouse.y) * 0.25;
      prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    if (e.touches.length === 2 && prevPinch !== null) {
      const d = pinchDist(e);
      fov = Math.max(30, Math.min(100, fov - (d - prevPinch) * 0.08));
      camera.fov = fov; camera.updateProjectionMatrix();
      prevPinch = d;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => { isDragging = false; prevPinch = null; });

  window.addEventListener('keydown', e => {
    if (document.getElementById('viewer-screen').style.display === 'none') return;
    if (e.code === 'Space') { e.preventDefault(); toggleRotate(); }
    if (e.code === 'KeyR')  { lon=0; lat=0; fov=75; camera.fov=fov; camera.updateProjectionMatrix(); }
    if (e.code === 'KeyV')  { toggleVR(); }
  });

  window.addEventListener('resize', () => {
    if (!renderer || renderer.xr.isPresenting) return;
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

function pinchDist(e) {
  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function toggleRotate() {
  autoRotate = !autoRotate;
  document.getElementById('rotate-btn').classList.toggle('active', autoRotate);
}

function destroyViewer() {
  if (xrSession) { xrSession.end(); xrSession = null; }
  if (renderer)  { renderer.setAnimationLoop(null); renderer.dispose(); renderer = null; }
  scene = camera = null;
  lon=0; lat=0; fov=75; autoRotate=false;
  document.getElementById('rotate-btn').classList.remove('active');
  vrBtn.textContent = '⬛ 進入 VR';
  vrBtn.classList.remove('vr-on');
}

/* ─────────────────────────────────────────
   上傳 / 載入
───────────────────────────────────────── */
const zone = document.getElementById('upload-zone');
const fi   = document.getElementById('file-input');

zone.addEventListener('dragover',  e  => { e.preventDefault(); zone.classList.add('dragover'); });
zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadPanorama(f);
});
fi.addEventListener('change', e => { if (e.target.files[0]) loadPanorama(e.target.files[0]); });

function loadPanorama(file) {
  document.getElementById('loading').classList.add('visible');
  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('viewer-screen').style.display = 'block';
  const url = URL.createObjectURL(file);
  requestAnimationFrame(() => initViewer(url));
}

/* ─────────────────────────────────────────
   按鈕
───────────────────────────────────────── */
document.getElementById('rotate-btn').addEventListener('click', toggleRotate);
vrBtn.addEventListener('click', toggleVR);

document.getElementById('fs-btn').addEventListener('click', () => {
  const el = document.getElementById('viewer-screen');
  if (!document.fullscreenElement) el.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});

document.getElementById('back-btn').addEventListener('click', () => {
  destroyViewer();
  document.getElementById('viewer-screen').style.display = 'none';
  document.getElementById('upload-screen').style.display = 'flex';
  fi.value = '';
});
</script>
</body>
</html>
