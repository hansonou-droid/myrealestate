<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貸款試算表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    padding: 24px;
  }
  .container { max-width: 960px; margin: 0 auto; }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 20px;
    color: #2d3748;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    padding: 24px;
    margin-bottom: 20px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    align-items: end;
  }
  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: .85rem;
    font-weight: 500;
    color: #4a5568;
  }
  .field input {
    padding: 10px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66,153,225,.15); }

  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  button {
    padding: 10px 28px;
    border: none;
    border-radius: 8px;
    font-size: .95rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-primary { background: #3182ce; color: #fff; }
  .btn-primary:hover { background: #2b6cb0; }
  .btn-reset { background: #edf2f7; color: #4a5568; }
  .btn-reset:hover { background: #e2e8f0; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 640px) {
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .stat {
    text-align: center;
    padding: 12px;
    background: #f7fafc;
    border-radius: 8px;
  }
  .stat .val { font-size: 1.25rem; font-weight: 700; color: #2d3748; }
  .stat .lbl { font-size: .8rem; color: #718096; margin-top: 2px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .875rem; }
  th {
    background: #f7fafc;
    text-align: right;
    padding: 10px 12px;
    font-weight: 600;
    color: #4a5568;
    border-bottom: 2px solid #e2e8f0;
    white-space: nowrap;
  }
  th:first-child { text-align: center; }
  td {
    text-align: right;
    padding: 8px 12px;
    border-bottom: 1px solid #edf2f7;
    font-variant-numeric: tabular-nums;
  }
  td:first-child { text-align: center; color: #718096; }
  tr:hover td { background: #f7fafc; }

  .error { color: #e53e3e; font-size: .875rem; margin-top: 8px; }

  .footer-note {
    text-align: center;
    font-size: .8rem;
    color: #a0aec0;
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>貸款試算表</h1>

  <div class="card">
    <div class="form-grid">
      <div class="field">
        <label for="amount">貸款金額</label>
        <input id="amount" type="number" inputmode="numeric" placeholder="例如 1000000" value="1000000">
      </div>
      <div class="field">
        <label for="rate">年利率 (%)</label>
        <input id="rate" type="number" inputmode="decimal" step="any" placeholder="例如 2.5" value="2.5">
      </div>
      <div class="field">
        <label for="years">貸款年限</label>
        <input id="years" type="number" inputmode="numeric" step="any" placeholder="例如 20" value="20">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="calculate()">計算</button>
      <button class="btn-reset" onclick="resetForm()">清除</button>
    </div>
    <div id="error" class="error"></div>
  </div>

  <div id="result" style="display:none;">
    <div class="card">
      <div class="summary-grid">
        <div class="stat"><div class="val" id="s-monthly"></div><div class="lbl">每期應付本息</div></div>
        <div class="stat"><div class="val" id="s-total-interest"></div><div class="lbl">總利息</div></div>
        <div class="stat"><div class="val" id="s-total-payment"></div><div class="lbl">總還款金額</div></div>
        <div class="stat"><div class="val" id="s-periods"></div><div class="lbl">總期數</div></div>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:1rem;font-weight:600;margin-bottom:12px;color:#2d3748;">各期償還明細</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>期數</th>
              <th>應付本息</th>
              <th>償還本金</th>
              <th>償還利息</th>
              <th>剩餘本金</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="footer-note">本試算結果僅供參考，實際以金融機構提供為準</div>
</div>

<script>
function format(n) {
  return '$ ' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function calculate() {
  const el = id => document.getElementById(id);
  const errEl = el('error');
  errEl.textContent = '';

  const P = parseFloat(el('amount').value);
  const annualRate = parseFloat(el('rate').value);
  const years = parseFloat(el('years').value);

  // validation
  if (isNaN(P) || P <= 0) { errEl.textContent = '請輸入有效的貸款金額'; return; }
  if (isNaN(annualRate) || annualRate < 0) { errEl.textContent = '請輸入有效的年利率'; return; }
  if (isNaN(years) || years <= 0) { errEl.textContent = '請輸入有效的貸款年限'; return; }

  const n = Math.round(years * 12);   // total months
  const r = annualRate / 100 / 12;     // monthly rate

  let monthly;
  if (r === 0) {
    monthly = P / n;
  } else {
    monthly = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
  }

  // build schedule
  let balance = P;
  let totalInterest = 0;
  let rows = [];

  for (let i = 1; i <= n; i++) {
    const interest = balance * r;
    const principal = monthly - interest;
    balance -= principal;
    totalInterest += interest;
    rows.push({
      period: i,
      payment: monthly,
      principal: principal,
      interest: interest,
      balance: i === n ? 0 : Math.max(balance, 0)
    });
  }

  // summary
  el('s-monthly').textContent = format(monthly);
  el('s-total-interest').textContent = format(totalInterest);
  el('s-total-payment').textContent = format(P + totalInterest);
  el('s-periods').textContent = n + ' 期';

  // table
  const tbody = el('tbody');
  tbody.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const row of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + row.period + '</td>' +
      '<td>' + format(row.payment) + '</td>' +
      '<td>' + format(row.principal) + '</td>' +
      '<td>' + format(row.interest) + '</td>' +
      '<td>' + format(row.balance) + '</td>';
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);

  el('result').style.display = 'block';
}

function resetForm() {
  document.getElementById('amount').value = '';
  document.getElementById('rate').value = '';
  document.getElementById('years').value = '';
  document.getElementById('error').textContent = '';
  document.getElementById('result').style.display = 'none';
}

// auto-calc on load
calculate();
</script>
</body>
</html>
