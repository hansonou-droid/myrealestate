<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>360° Panorama Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }
body { background:#100c07; color:#F7F3EC; font-family:system-ui,sans-serif; }
button { cursor:pointer; }

#upload-screen {
  width:100%; height:100%;
  display:none; flex-direction:column;
  align-items:center; justify-content:center;
  background:#F7F3EC; color:#3A2E24;
}

.upload-headline { font-size:28px; font-weight:300; margin-bottom:6px; }
.upload-sub { font-size:14px; opacity:0.6; margin-bottom:36px; }

.upload-zone {
  width:400px; height:220px;
  border:1px solid #C4B9A8;
  display:flex; align-items:center; justify-content:center;
  position:relative; transition:border-color 0.25s, background 0.25s;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color:#C9A97A; background:rgba(201,169,122,0.07);
}
.upload-inner {
  display:flex; flex-direction:column; align-items:center; gap:10px;
  pointer-events:none;
}
.upload-label { font-size:13px; }
.upload-hint { font-size:11px; opacity:0.5; }
#file-input { position:absolute; inset:0; opacity:0; cursor:pointer; }

#viewer-screen {
  width:100%; height:100%;
  position:relative; display:none;
  cursor:grab;
}
#viewer-screen:active { cursor:grabbing; }
#three-canvas { position:absolute; inset:0; display:block; }

.vignette {
  position:absolute; inset:0;
  background:radial-gradient(ellipse at center, transparent 50%, rgba(10,7,3,0.62) 100%);
  pointer-events:none; z-index:1;
}

#compass {
  position:absolute; top:50%; right:24px;
  transform:translateY(-50%);
  width:44px; height:44px;
  z-index:10; pointer-events:none; opacity:0.5;
}

.viewer-bottom {
  position:absolute; bottom:0; left:0; right:0;
  padding:18px 24px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(to top, rgba(10,7,3,0.6) 0%, transparent 100%);
  z-index:10;
}

.hint-text { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; opacity:0.4; }
.ctrl-group { display:flex; gap:6px; }

.ctrl-btn {
  background:rgba(247,243,236,0.1);
  border:1px solid rgba(247,243,236,0.18);
  color:rgba(247,243,236,0.75);
  font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
  padding:7px 14px; transition:all 0.25s;
}
.ctrl-btn:hover {
  background:rgba(201,169,122,0.25);
  border-color:rgba(201,169,122,0.4);
  color:#C9A97A;
}
.ctrl-btn.active {
  background:rgba(201,169,122,0.25);
  border-color:#C9A97A; color:#C9A97A;
}

#loading {
  position:fixed; inset:0; background:#F7F3EC;
  display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:16px; z-index:999;
}
#loading.visible { display:flex; }

.load-ring {
  width:36px; height:36px;
  border:1.5px solid #C4B9A8;
  border-top-color:#C9A97A; border-radius:50%;
  animation:spin 0.85s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.load-text { font-size:10px; letter-spacing:3px; text-transform:uppercase; opacity:0.5; color:#3A2E24; }
</style>
</head>
<body>

<div id="upload-screen">
  <h1 class="upload-headline">360° Panorama Viewer</h1>
  <p class="upload-sub">Drop or select an equirectangular image</p>
  <div class="upload-zone" id="upload-zone">
    <div class="upload-inner">
      <span class="upload-label">載入全景圖</span>
      <span class="upload-hint">JPG / PNG · 建議比例 2:1</span>
    </div>
    <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp">
  </div>
</div>

<div id="viewer-screen" style="display:block;">
  <canvas id="three-canvas"></canvas>
  <div class="vignette"></div>

  <div id="compass">
    <svg viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" stroke="#F7F3EC" stroke-width="0.7" opacity="0.35"/>
      <text x="24" y="5" text-anchor="middle" font-size="6.5" fill="#C9A97A" font-weight="500">N</text>
      <text x="24" y="46" text-anchor="middle" font-size="5.5" fill="#F7F3EC" opacity="0.45">S</text>
      <text x="45" y="26" text-anchor="middle" font-size="5.5" fill="#F7F3EC" opacity="0.45">E</text>
      <text x="3" y="26" text-anchor="middle" font-size="5.5" fill="#F7F3EC" opacity="0.45">W</text>
      <line x1="24" y1="8" x2="24" y2="16" stroke="#F7F3EC" stroke-width="0.6" opacity="0.35"/>
      <line x1="24" y1="32" x2="24" y2="40" stroke="#F7F3EC" stroke-width="0.6" opacity="0.35"/>
      <line x1="8" y1="24" x2="16" y2="24" stroke="#F7F3EC" stroke-width="0.6" opacity="0.35"/>
      <line x1="32" y1="24" x2="40" y2="24" stroke="#F7F3EC" stroke-width="0.6" opacity="0.35"/>
      <g id="compass-needle">
        <polygon points="24,10 26.5,24 24,20 21.5,24" fill="#C9A97A" opacity="0.95"/>
        <polygon points="24,38 26.5,24 24,28 21.5,24" fill="#F7F3EC" opacity="0.4"/>
      </g>
      <circle cx="24" cy="24" r="2" fill="#C9A97A"/>
    </svg>
  </div>

  <div class="viewer-bottom">
      <span style="font-size:12px;letter-spacing:1px;opacity:0.6;">0938-832-968 ©2026 歐俊毅 版權所有</span>
      <div class="ctrl-group">
      <button class="ctrl-btn" id="rotate-btn">自動旋轉</button>
      <button class="ctrl-btn" id="music-btn">音樂 ♫</button>
      <button class="ctrl-btn" id="fs-btn">全螢幕</button>
      <button class="ctrl-btn" id="back-btn">← 返回</button>
    </div>
  </div>
</div>

<audio id="bgm" src="./Morning.mp3" loop preload="auto"></audio>

<div id="loading">
  <div class="load-ring"></div>
  <div class="load-text">載入全景圖中</div>
</div>

<script>
let scene, camera, renderer, animId, sphere;
let lon = 0, lat = 0, fov = 75;
let isDragging = false, prevMouse = {x:0,y:0};
let prevPinch = null;
let autoRotate = true;

function initViewer(url) {
  const canvas = document.getElementById('three-canvas');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(fov, innerWidth / innerHeight, 1, 1100);
  camera.position.set(0, 0, 0.001);
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  bindEvents(canvas);
  loop();

  // 使用原生 Image 載入，避免 file:// 協議下 XHR 的 CORS 限制
  const img = new Image();
  img.onload = () => {
    const geo = new THREE.SphereGeometry(500, 72, 40);
    geo.scale(-1, 1, 1);
    const tex = new THREE.Texture(img);
    tex.needsUpdate = true;
    tex.minFilter = THREE.LinearFilter;
    sphere = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex }));
    scene.add(sphere);
    document.getElementById('loading').classList.remove('visible');
  };
  img.onerror = () => {
    document.getElementById('loading').classList.remove('visible');
    const div = document.createElement('div');
    div.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#100c07;z-index:999;';
    div.innerHTML = '<p style="font-size:13px;letter-spacing:2px;color:#C9A97A;">⚠ 無法載入 360pic.png</p><p style="font-size:11px;opacity:0.5;color:#F7F3EC;">請確認檔案與 HTML 位於同一資料夾</p>';
    document.body.appendChild(div);
  };
  img.src = url;
}

function loop() {
  animId = requestAnimationFrame(loop);
  if (autoRotate && !isDragging) lon += 0.055;

  lat = Math.max(-85, Math.min(85, lat));
  const phi   = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);

  camera.lookAt(
    500 * Math.sin(phi) * Math.cos(theta),
    500 * Math.cos(phi),
    500 * Math.sin(phi) * Math.sin(theta)
  );

  const n = document.getElementById('compass-needle');
  if (n) n.setAttribute('transform', `rotate(${-lon % 360}, 24, 24)`);

  renderer.render(scene, camera);
}

function bindEvents(canvas) {
  canvas.addEventListener('mousedown', e => {
    startMusic();
    isDragging = true;
    prevMouse = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('mouseup', () => isDragging = false);
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    lon -= (e.clientX - prevMouse.x) * 0.18;
    lat += (e.clientY - prevMouse.y) * 0.18;
    prevMouse = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('mouseup', () => isDragging = false);

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    fov = Math.max(30, Math.min(100, fov + e.deltaY * 0.04));
    camera.fov = fov;
    camera.updateProjectionMatrix();
  }, { passive: false });

  canvas.addEventListener('touchstart', e => {
    startMusic();
    if (e.touches.length === 1) {
      isDragging = true;
      prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    if (e.touches.length === 2) prevPinch = pinchDist(e);
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      lon -= (e.touches[0].clientX - prevMouse.x) * 0.25;
      lat += (e.touches[0].clientY - prevMouse.y) * 0.25;
      prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    if (e.touches.length === 2 && prevPinch !== null) {
      const d = pinchDist(e);
      fov = Math.max(30, Math.min(100, fov - (d - prevPinch) * 0.08));
      camera.fov = fov; camera.updateProjectionMatrix();
      prevPinch = d;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => { isDragging = false; prevPinch = null; });

  window.addEventListener('keydown', e => {
    if (document.getElementById('viewer-screen').style.display === 'none') return;
    if (e.code === 'Space')  { e.preventDefault(); toggleRotate(); }
    if (e.code === 'KeyR')   { lon = 0; lat = 0; fov = 75; camera.fov = fov; camera.updateProjectionMatrix(); }
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

function pinchDist(e) {
  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function toggleRotate() {
  autoRotate = !autoRotate;
  document.getElementById('rotate-btn').classList.toggle('active', autoRotate);
}

function destroyViewer() {
  if (animId) cancelAnimationFrame(animId);
  if (renderer) { renderer.dispose(); renderer = null; }
  scene = camera = null;
  lon = 0; lat = 0; fov = 75;
  autoRotate = false;
  document.getElementById('rotate-btn').classList.remove('active');
}

// 音樂控制
let musicPlaying = false;
const bgm = document.getElementById('bgm');

function startMusic() {
  if (musicPlaying || !bgm.paused) return;
  bgm.play().then(() => {
    musicPlaying = true;
    document.getElementById('music-btn').classList.add('active');
  }).catch(() => {});
}

function toggleMusic() {
  if (musicPlaying) {
    bgm.pause();
    musicPlaying = false;
    document.getElementById('music-btn').classList.remove('active');
  } else {
    startMusic();
  }
}

// 瀏覽器限制：需用戶互動後才能播放音訊，嘗試立即播放
bgm.play().then(() => {
  musicPlaying = true;
  document.getElementById('music-btn').classList.add('active');
}).catch(() => {});
